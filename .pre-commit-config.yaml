# PatientVectorHub — pre-commit hooks
#
# Reconstructed in Phase 12 (ADR-018 flagged this file as an unrecoverable
# [Binary file] marker). Matches what .github/workflows/ci.yml already runs
# (ruff, mypy on api-gateway/ingestion/rag-engine, eslint on dashboard) so
# a commit that passes locally passes CI, rather than inventing a separate
# rule set.
#
# All `rev:` values are commit SHAs, not tags. Tags are mutable — anyone
# with write access to the hook's repo can move one to point at malicious
# code. This is the same class of gap Phase 11 (ADR-018) flagged for
# aquasecurity/trivy-action@master, which was actually exploited via tag
# hijacking in March 2026. Verified via `git ls-remote --tags` against
# each hook repo, not copied from an example.
#
# Run `pre-commit install` once per clone. `pre-commit autoupdate` will
# rewrite these back to floating tags — re-pin to a SHA after running it.

default_language_version:
  python: python3.11
  node: "22"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents] # Helm templates + K8s multi-doc manifests
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=2048]
      - id: check-merge-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/Yelp/detect-secrets
    rev: 01886c8a910c64595c47f186ca1ffc0b77fa5458 # v1.5.0
    hooks:
      - id: detect-secrets
        args: [--baseline, .secrets.baseline]
        exclude: package-lock.json|dashboard/pnpm-lock.yaml

  # ── Python: api-gateway, ingestion, rag-engine, vector-store, embedding-server ──
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: aab412d509121cb5f7533134b7e67f9fab59c682 # v0.16.4
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # mypy runs from the project's own venv (repo: local) so pyproject.toml's
  # pinned mypy version is the single source of truth -- no separate
  # mirror version to keep in sync. Matches ci.yml's `mypy api-gateway/src
  # ingestion/src rag-engine/src` exactly.
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: mypy api-gateway/src ingestion/src rag-engine/src
        language: system
        types: [python]
        pass_filenames: false

  # ── Frontend: dashboard ──
  - repo: local
    hooks:
      - id: eslint
        name: eslint (dashboard)
        entry: bash -c 'cd dashboard && npx eslint src/ --ext .ts,.tsx'
        language: system
        files: ^dashboard/src/.*\.(ts|tsx)$
        pass_filenames: false

  # ── Terraform (Phase 12) ──
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: c0f51014b8ec51c4455a7dac40697be15e285668 # v1.99.5
    hooks:
      - id: terraform_fmt
        args: [--args=-recursive]
      - id: terraform_validate
        exclude: ^infra/terraform/cluster/backend\.tf$ # partial backend config, no bucket at lint time

  # ── Shell scripts (vault_init.sh, dr_switch_to_qdrant.sh, launch sequences) ──
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: 4de1378e4cd853bfc2b111b05fff35e2dbf809a3 # v0.9.0.6
    hooks:
      - id: shellcheck
        args: [--severity=warning]
