[pytest]
# API Gateway service tests configuration
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
pythonpath = .

# Markers
markers =
    unit: Unit tests (no external dependencies)
    integration: Integration tests (requires docker-compose or live services)
    slow: Slow tests
    auth: Authentication/authorization tests
    db: Database/RLS tests
    api: API endpoint tests

# Asyncio configuration
asyncio_mode = auto

# Logging
log_cli = false
log_cli_level = INFO
log_file = tests/pytest.log
log_file_level = DEBUG

# Coverage (optional)
addopts = 
    -v
    --tb=short
    --strict-markers
