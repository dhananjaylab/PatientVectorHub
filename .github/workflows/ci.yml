name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # Phase 11 / ADR-018 Stage 11.3: needed for the new e2e job below,
  # which runs on manual trigger only (confirmed decision -- the full
  # docker-compose-equivalent stack this needs is real cost, not
  # something to run on every PR). Every other job below keeps running
  # on its existing push/pull_request triggers regardless of this
  # addition; a manual dispatch of this workflow runs everything,
  # e2e included, which is the expected "run the full pipeline" reading
  # of triggering it by hand.
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff + mypy + eslint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python deps
        run: |
          pip install ruff mypy \
            pydantic>=2.13.4 sqlalchemy>=2.0.51 fastapi>=0.139.2 httpx

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: MyPy
        run: |
          mypy api-gateway/src ingestion/src rag-engine/src vector-store/src \
            --ignore-missing-imports

      # Phase 9: bumped 20 -> 22. react-router@8 (dashboard/package.json)
      # hard-requires Node >=22.22.0 -- `npm ci` fails dependency
      # resolution outright on Node 20, not just a warning. Vite 7's own
      # floor (^20.19 || >=22.12) would tolerate 20, but react-router's is
      # the stricter constraint that actually governs here.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      # Phase 9: `--ext .ts,.tsx` was a legacy (pre-v9) ESLint CLI flag
      # tied to the old .eslintrc.* config-resolution system -- there was
      # never actually a .eslintrc.* file in this repo for it to resolve
      # against (this ESLint step has been running against whatever
      # ESLint's own fallback behavior was, not a real project config,
      # since Phase 1). dashboard/eslint.config.js (new this phase) is
      # flat config, which discovers files via its own `files` glob
      # patterns -- `--ext` is simply not part of that system's CLI
      # surface. `npm ci` also replaces the ad-hoc `npm ci --prefer-offline`
      # invocation with the package.json-declared `lint` script, so this
      # step and a local `npm run lint` can never silently drift apart.
      - name: ESLint
        working-directory: dashboard
        run: |
          npm ci --prefer-offline
          npm run lint

  dashboard-test:
    name: Dashboard (typecheck + vitest + build)
    runs-on: ubuntu-latest
    # New in Phase 9. Deliberately separate from the `lint` job above
    # (fast ESLint feedback) the same way test-unit is separate from
    # lint for the Python side -- typecheck/vitest/build is the heavier,
    # slower path. Does NOT run the Playwright e2e suite: those specs
    # need the full docker-compose stack (Postgres/Redis/Keycloak/Kafka/
    # Weaviate) running, which is real CI infrastructure work of its own
    # -- see docs/PHASE_9_IMPLEMENTATION_PLAN.md §7. `npm run test` here
    # is Vitest only, fully backend-independent (every hook/component
    # test mocks src/lib/api.ts directly).
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install deps
        working-directory: dashboard
        run: npm ci --prefer-offline

      - name: Typecheck
        working-directory: dashboard
        run: npm run typecheck

      - name: Unit tests (Vitest)
        working-directory: dashboard
        run: npm run test

      - name: Production build
        working-directory: dashboard
        run: npm run build
        env:
          # Matches .env.example's local-dev default -- CI isn't running
          # against a real Keycloak, so the build must not require one.
          VITE_API_BASE_URL: /v1
          VITE_AUTH_ENABLED: "false"

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: |
          pip install pytest pytest-asyncio pytest-cov \
            fastapi>=0.139.2 httpx pydantic>=2.13.4 "pydantic-settings>=2.14.2" \
            "sqlalchemy[asyncio]>=2.0.51" asyncpg python-dotenv \
            "PyJWT[crypto]>=2.13.0" redis \
            weaviate-client qdrant-client
          # Phase 4 additions: parsers/chunker/embedder unit tests
          # (tests/unit/test_ingestion_*.py) import these directly, with
          # R2/network calls always mocked (decision: no live R2
          # credentials needed in CI). PyMuPDF/hl7/langchain-text-splitters
          # here are lightweight and network-free at import time.
          pip install boto3 pymupdf hl7 langchain-text-splitters openai tenacity \
            "celery[redis]" aiokafka
          # Phase 5 addition: clinical_bert_embedder.py / embeddings provider
          # dispatch tests (tests/unit/test_clinical_bert_embedder.py,
          # test_embeddings_provider_routing.py) import huggingface_hub
          # directly, same "fails to collect, not just fails" reasoning as
          # weaviate-client/qdrant-client above (ADR-012).
          pip install "huggingface_hub>=1.24.0,<1.25.0"
          # Phase 7 addition: rag-engine's llm_router.py / query_embedder.py
          # unit tests (tests/unit/test_llm_router.py,
          # test_query_embedder.py) import anthropic and google-genai
          # directly for their exception types (e.g.
          # retry_if_exception_type((RateLimitError, ...))), even though
          # the actual clients are lazily constructed and mocked in every
          # test -- same "fails to collect, not just fails" class of
          # problem as every other SDK on this list. See
          # docs/adr/ADR-014-rag-query-engine.md.
          pip install "anthropic>=0.120.0,<0.121.0" "google-genai>=2.14.0,<3.0.0"
          # Phase 8 addition: slowapi -- src.middleware.rate_limit
          # (ADR-015) is imported by main.py and every rate-limited
          # router (ingest, query, admin, audit), so EVERY api-gateway
          # unit test file now fails to *collect* without it, not just
          # the new Phase 8 test files -- same "fails to collect, not
          # just fails" class of problem as every other SDK on this list.
          pip install "slowapi>=0.1.10,<0.2.0"
          # Phase 10 / ADR-017: src/vault_client.py and src/observability.py
          # are both imported at module scope by main.py (and by every
          # router/middleware this phase touched) -- same "fails to
          # collect, not just fails" class of problem as every other SDK
          # on this list.
          pip install "hvac>=2.3.0,<2.5.0" "prometheus-client>=0.21.0,<0.27.0" \
            "opentelemetry-api>=1.29.0,<1.45.0" "opentelemetry-sdk>=1.29.0,<1.45.0" \
            "opentelemetry-instrumentation-fastapi>=0.50b0,<0.66b0" \
            "opentelemetry-instrumentation-sqlalchemy>=0.50b0,<0.66b0" \
            "opentelemetry-exporter-otlp-proto-grpc>=1.29.0,<1.45.0"
          # pydantic-settings and asyncpg were previously missing here even
          # though api-gateway/src/config.py (BaseSettings) and the Phase 2
          # db/session.py (create_async_engine against a postgresql+asyncpg
          # URL) both need them at import time -- without them, any test
          # importing src.config or src.db.session fails to *collect*,
          # which fails the whole pytest run, not just the affected tests.
          # Same reasoning applies to weaviate-client/qdrant-client below
          # (needed by tests/unit/test_weaviate_schema.py, which imports
          # scripts/setup_weaviate_schema.py and weaviate.classes.config
          # directly, with no ImportError guard at test-module scope).
          #
          # PyJWT replaces python-jose here: python-jose has had no
          # meaningful release in years and depends on the still-unpatched
          # `ecdsa` package (timing side-channel); api-gateway/src/
          # middleware/auth.py is written against PyJWT's PyJWKClient.

      - name: Run unit tests
        # Phase 10 / ADR-017 fix (pre-existing, unrelated to this phase's
        # own changes): this step had no working-directory, so
        # `pytest tests/unit/` run from the repo root could never find
        # api-gateway/tests/unit/ at all -- reproduced the exact failure
        # locally ("ERROR: file or directory not found: tests/unit/")
        # while verifying this phase's own new test files would actually
        # run in CI, not just locally. --cov target path adjusted to
        # match the new working directory.
        working-directory: api-gateway
        env:
          ENVIRONMENT: test
          DATABASE_URL: postgresql+asyncpg://pvh:pvh_local@localhost:5432/pvh
          REDIS_URL: redis://localhost:6379/0
          VAULT_ADDR: http://localhost:8200
          VAULT_TOKEN: dev-root-token
          AUTH_ENABLED: "false"
          OPENAI_API_KEY: sk-test-not-a-real-key
          HF_TOKEN: hf_test-not-a-real-token
          # Phase 7: same "fake but present" pattern as OPENAI_API_KEY/
          # HF_TOKEN above -- llm_router.py's lazy client construction
          # (_get_anthropic_client() etc.) must not crash at construction
          # time even with a non-functional key; the actual retry/error
          # tests mock the network call itself, not these env vars.
          ANTHROPIC_API_KEY: sk-ant-test-not-a-real-key
          GEMINI_API_KEY: test-not-a-real-gemini-key
        run: |
          pytest tests/unit/ tests/security/ -v \
            --cov=src \
            --cov-report=xml \
            --cov-fail-under=80 \
            -q

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          # Phase 10 / ADR-017: path adjusted alongside the preceding
          # step's new working-directory: api-gateway -- coverage.xml now
          # lands there, not at the repo root.
          file: api-gateway/coverage.xml
        continue-on-error: true

  test-unit-ingestion:
    name: Unit Tests (ingestion)
    runs-on: ubuntu-latest
    # New in Phase 11 (ADR-018). ingestion/tests/unit/ has existed since
    # Phase 4 and has never once run in CI -- only api-gateway (test-unit
    # above) and dashboard (dashboard-test) had CI wiring before this
    # phase. Verified locally first: 54/54 passing, 68% coverage on src/
    # (includes test_clinical_bert_embedder.py, relocated here this phase
    # from embedding-server/ -- see ADR-018's "discovered bugs" section).
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        working-directory: ingestion
        run: pip install -r requirements.txt

      - name: Run unit tests
        working-directory: ingestion
        run: |
          pytest tests/unit/ -v \
            --cov=src \
            --cov-report=xml \
            --cov-fail-under=65 \
            -q

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ingestion/coverage.xml
        continue-on-error: true

  test-unit-vector-store:
    name: Unit Tests (vector-store)
    runs-on: ubuntu-latest
    # New in Phase 11 (ADR-018). Same never-ran-in-CI gap as ingestion
    # above. Fixing this surfaced a real, independent bug: vector-store's
    # own requirements.txt never listed pytest-asyncio, despite
    # pytest.ini declaring asyncio_mode=auto and 3 of 7 unit test files
    # using async tests -- a clean install from that file alone could
    # never collect test_dual_write_store.py, test_qdrant_store.py, or
    # test_weaviate_search_delete.py (reproduced locally: "'asyncio' not
    # found in `markers` configuration option"). Fixed in
    # vector-store/requirements.txt this phase; 30/30 passing, 89%
    # coverage once fixed.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        working-directory: vector-store
        run: pip install -r requirements.txt

      - name: Run unit tests
        working-directory: vector-store
        run: |
          pytest tests/unit/ -v \
            --cov=src \
            --cov-report=xml \
            --cov-fail-under=80 \
            -q

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: vector-store/coverage.xml
        continue-on-error: true

  test-unit-rag-engine:
    name: Unit Tests (rag-engine)
    runs-on: ubuntu-latest
    # New in Phase 11 (ADR-018). Same never-ran-in-CI gap. Verified
    # clean locally, no issues found: 30/30 passing, 92% coverage.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        working-directory: rag-engine
        run: pip install -r requirements.txt

      - name: Run unit tests
        working-directory: rag-engine
        run: |
          pytest tests/unit/ -v \
            --cov=src \
            --cov-report=xml \
            --cov-fail-under=80 \
            -q

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: rag-engine/coverage.xml
        continue-on-error: true

  test-unit-embedding-server:
    name: Unit Tests (embedding-server)
    runs-on: ubuntu-latest
    # New in Phase 11 (ADR-018). This job's history is the clearest
    # argument for the other three above: embedding-server had zero CI
    # wiring AND its only two "real" test files (test_clinical_bert_embedder.py,
    # test_logging.py) were misplaced here from ingestion/ and
    # api-gateway/ respectively, each importing a `src.*` module that
    # only ever existed in the OTHER service. Reproduced locally: both
    # failed with "ModuleNotFoundError: No module named 'src'" --
    # 13 failed + 1 collection error out of what this directory reported
    # as its own tests. Both relocated this phase (see ADR-018); what's
    # left here is genuinely embedding-server's own: the HF deploy-script
    # test. Not coverage-gated on scripts/ -- same as no other service
    # gates its scripts/ directory, and this script's own real HF API
    # calls make high unit coverage the wrong target here anyway.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        working-directory: embedding-server
        run: pip install pytest pytest-cov huggingface_hub python-dotenv

      - name: Run unit tests
        working-directory: embedding-server
        run: pytest tests/unit/ -v -q

  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: pvh
          POSTGRES_PASSWORD: pvh_local
          POSTGRES_DB: pvh
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      # Phase 4 addition: Kafka (KRaft, single broker -- mirrors
      # docker-compose.yml's local dev config) so
      # tests/integration/test_ingestion_end_to_end.py and
      # test_ingestion_dlq_end_to_end.py have a real doc-ingest /
      # doc-dlq broker to talk to.
      kafka:
        image: apache/kafka:3.6.0
        ports:
          - 9092:9092
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_CONTROLLER_QUORUM_VOTERS: "1@localhost:9093"
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
          CLUSTER_ID: pvh-ci-cluster-id-001
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 12
      # Phase 4 addition: Weaviate, so test_ingestion_end_to_end.py can
      # assert a real vector actually landed in the tenant's shard.
      weaviate:
        image: semitechnologies/weaviate:1.24.1
        ports:
          - 8080:8080
          - 50051:50051
        env:
          AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
          PERSISTENCE_DATA_PATH: /var/lib/weaviate
          DEFAULT_VECTORIZER_MODULE: none
          CLUSTER_HOSTNAME: weaviate-ci
        options: >-
          --health-cmd "wget -qO- http://localhost:8080/v1/.well-known/ready"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
      # Phase 6 addition (ADR-013): Qdrant, so
      # tests/integration/test_vector_store_layer.py can prove the
      # dual-write path actually reaches a real Qdrant instance, not just
      # a mocked one (tests/unit/test_dual_write_store.py covers the
      # mocked policy).
      qdrant:
        image: qdrant/qdrant:v1.8.1
        ports:
          - 6333:6333
          - 6334:6334
        options: >-
          --health-cmd "wget -qO- http://localhost:6333/healthz"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
      # Phase 10 / ADR-017: HashiCorp Vault dev mode, same
      # VAULT_DEV_ROOT_TOKEN_ID as docker-compose.yml's vault service —
      # backs both seed_data.py's real MRN encryption path (see the
      # "Seed one tenant" step below) and any test in tests/integration/
      # that exercises vault_client.py against a live Transit engine.
      vault:
        image: hashicorp/vault:1.15
        ports:
          - 8200:8200
        env:
          VAULT_DEV_ROOT_TOKEN_ID: dev-root-token
          VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
        options: >-
          --cap-add=IPC_LOCK
          --health-cmd "vault status -address=http://127.0.0.1:8200"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: |
          pip install pytest pytest-asyncio pytest-cov \
            fastapi>=0.139.2 httpx pydantic>=2.13.4 "pydantic-settings>=2.14.2" \
            "sqlalchemy[asyncio]>=2.0.51" asyncpg \
            alembic>=1.18.5 "PyJWT[crypto]>=2.13.0" redis aiokafka \
            python-dotenv
          # Phase 4: full ingestion stack for the end-to-end tests
          pip install boto3 pymupdf hl7 langchain-text-splitters openai tenacity \
            "celery[redis]" weaviate-client qdrant-client psycopg2-binary
          # Phase 7: rag-engine's own deps, so
          # tests/integration/test_rag_query_pipeline.py can be collected
          # (it self-skips at runtime without a real ANTHROPIC_API_KEY --
          # see that file's pytestmark -- but still needs anthropic/
          # google-genai/huggingface_hub importable to collect at all).
          pip install "anthropic>=0.120.0,<0.121.0" "google-genai>=2.14.0,<3.0.0" \
            "huggingface_hub>=1.24.0,<1.25.0"
          # Phase 8 addition: same reason as test-unit above.
          pip install "slowapi>=0.1.10,<0.2.0"
          # Phase 10 / ADR-017: observability + Vault deps — same
          # versions verified together in api-gateway/requirements.txt
          # and ingestion/requirements.txt.
          pip install "hvac>=2.3.0,<2.5.0" "prometheus-client>=0.21.0,<0.27.0" \
            "opentelemetry-api>=1.29.0,<1.45.0" "opentelemetry-sdk>=1.29.0,<1.45.0" \
            "opentelemetry-instrumentation-fastapi>=0.50b0,<0.66b0" \
            "opentelemetry-instrumentation-sqlalchemy>=0.50b0,<0.66b0" \
            "opentelemetry-instrumentation-celery>=0.50b0,<0.66b0" \
            "opentelemetry-exporter-otlp-proto-grpc>=1.29.0,<1.45.0"

      - name: Initialize Vault transit key (Phase 10 / ADR-017)
        # Mirrors infra/scripts/vault_init.sh's transit portion via hvac
        # directly rather than installing the vault CLI binary onto the
        # runner just for this one step — enable transit + create the
        # same "phi-key" name vault_client.py and seed_data.py both
        # target (settings.VAULT_TRANSIT_KEY's default).
        env:
          VAULT_ADDR: http://localhost:8200
          VAULT_TOKEN: dev-root-token
        run: |
          python -c "
          import hvac
          client = hvac.Client(url='http://localhost:8200', token='dev-root-token')
          # list_mounted_secrets_engines() hits GET /v1/sys/mounts, whose
          # mount paths are nested under response['data'], not the
          # top-level dict (verified directly against hvac's own source,
          # not assumed) -- checking 'transit/' in the raw response
          # would always be False regardless of actual mount state.
          mounts = client.sys.list_mounted_secrets_engines().get('data', {})
          if 'transit/' not in mounts:
              client.sys.enable_secrets_engine(backend_type='transit', path='transit')
          try:
              client.secrets.transit.read_key(name='phi-key')
          except Exception:
              client.secrets.transit.create_key(name='phi-key')
          print('Vault transit key phi-key ready')
          "

      - name: Run Alembic migrations
        env:
          DATABASE_URL: postgresql+asyncpg://pvh:pvh_local@localhost:5432/pvh
        run: cd api-gateway && python -m alembic upgrade head

      - name: Seed one tenant for ingestion tests
        env:
          DATABASE_URL_SYNC: postgresql+psycopg2://pvh:pvh_local@localhost:5432/pvh
          # Phase 10 / ADR-017: with Vault now up and phi-key created
          # (previous step), this exercises seed_data.py's REAL
          # encryption path (resolve_mrn -> real_mrn), not the
          # fake_mrn() fallback — proving the pathway works in CI, not
          # just in a mocked unit test.
          VAULT_ADDR: http://localhost:8200
          VAULT_TOKEN: dev-root-token
        run: python -u infra/scripts/seed_data.py

      - name: Set up Weaviate PatientDocument collection
        env:
          WEAVIATE_HOST: localhost
          WEAVIATE_PORT: "8080"
        run: python vector-store/scripts/setup_weaviate_schema.py

      - name: Set up Qdrant collection (ADR-013)
        env:
          QDRANT_HOST: localhost
          QDRANT_PORT: "6333"
        run: python vector-store/scripts/setup_qdrant_schema.py

      - name: Create Kafka topics
        env:
          KAFKA_BROKERS: localhost:9092
        run: python ingestion/scripts/create_kafka_topics.py

      - name: Create RLS test role (non-superuser, exercises RLS policies)
        env:
          PGPASSWORD: pvh_local
        run: |
          # POSTGRES_USER=pvh above is the initdb bootstrap superuser --
          # it bypasses RLS unconditionally (rolsuper=true), regardless
          # of FORCE ROW LEVEL SECURITY. Testing isolation against it
          # would either always skip or produce false failures; neither
          # actually proves the policy works. This role is a plain,
          # non-superuser, NOBYPASSRLS login used only by
          # test_rls_isolation*.py to get a real, non-bypassing signal.
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          psql -h localhost -U pvh -d pvh -v ON_ERROR_STOP=1 <<'SQL'
            DO $$
            BEGIN
              IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'pvh_rls_test') THEN
                CREATE ROLE pvh_rls_test LOGIN PASSWORD 'pvh_rls_test'
                  NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE;
              END IF;
            END
            $$;
            GRANT CONNECT ON DATABASE pvh TO pvh_rls_test;
            GRANT USAGE ON SCHEMA public TO pvh_rls_test;
            GRANT SELECT, INSERT, UPDATE, DELETE ON tenants, users, patients,
              ingestion_jobs, documents, api_keys, audit_logs, query_logs
              TO pvh_rls_test;
            -- Deliberately NOT granting EXECUTE on resolve_api_key_tenant()
            -- here: test_rls_isolation_core_tables.py's
            -- TestApiKeyResolverFailsClosed asserts the ADR-010 fail-closed
            -- default (zero rows OR permission-denied), which is exactly
            -- what an ungranted EXECUTE produces. Granting it here would
            -- test the wrong thing.
          SQL

      # Phase 11 / ADR-018 fix (pre-existing, unrelated to this phase's own
      # scope beyond fixing it): this used to be one step --
      # `pytest tests/integration/ -v -m integration` -- run with no
      # working-directory. No root tests/integration/ exists anywhere in
      # this repo (confirmed: only api-gateway/, ingestion/, vector-store/,
      # and rag-engine/ each have their own tests/integration/), so that
      # literal path could never resolve; the step would fail collection
      # immediately on every run. Reproduced locally before fixing.
      #
      # This is deliberately 4 steps, not 1 combined `pytest a/ b/ c/ d/`
      # invocation: api-gateway, ingestion, vector-store, and rag-engine
      # each name their top-level package `src` -- running them through one
      # pytest process risks exactly the cross-service `src` collision
      # api-gateway/conftest.py's own docstring already documents (and
      # works around, for its rag_engine/vector_store imports) from a
      # prior phase. Separate cd-scoped steps, each resolving its own
      # pytest.ini's `pythonpath = .` independently, sidesteps that
      # entirely -- same pattern the Alembic step above already uses.
      - name: Run integration tests (api-gateway)
        working-directory: api-gateway
        env:
          DATABASE_URL: postgresql+asyncpg://pvh:pvh_local@localhost:5432/pvh
          DATABASE_URL_SYNC: postgresql+psycopg2://pvh:pvh_local@localhost:5432/pvh
          RLS_TEST_DATABASE_URL: postgresql+asyncpg://pvh_rls_test:pvh_rls_test@localhost:5432/pvh
          REDIS_URL: redis://localhost:6379/0
          ENVIRONMENT: test
          VAULT_ADDR: http://localhost:8200
          VAULT_TOKEN: dev-root-token
        run: pytest tests/integration/ -v -m integration --tb=short -q

      - name: Run integration tests (ingestion)
        working-directory: ingestion
        env:
          DATABASE_URL: postgresql+asyncpg://pvh:pvh_local@localhost:5432/pvh
          DATABASE_URL_SYNC: postgresql+psycopg2://pvh:pvh_local@localhost:5432/pvh
          KAFKA_BROKERS: localhost:9092
          WEAVIATE_HOST: localhost
          WEAVIATE_PORT: "8080"
          ENVIRONMENT: test
          # OPENAI_API_KEY intentionally NOT set -- test_ingestion_end_to_end.py
          # self-skips a real-embedding assertion when it's absent (see
          # that file's pytestmark). Set as a repo secret to exercise it
          # for real; incurs a small API cost per run.
        run: pytest tests/integration/ -v -m integration --tb=short -q

      - name: Run integration tests (vector-store)
        working-directory: vector-store
        env:
          WEAVIATE_HOST: localhost
          WEAVIATE_PORT: "8080"
          QDRANT_HOST: localhost
          QDRANT_PORT: "6333"
          ENVIRONMENT: test
        run: pytest tests/integration/ -v -m integration --tb=short -q

      - name: Run integration tests (rag-engine)
        working-directory: rag-engine
        env:
          WEAVIATE_HOST: localhost
          WEAVIATE_PORT: "8080"
          QDRANT_HOST: localhost
          QDRANT_PORT: "6333"
          ENVIRONMENT: test
          # ANTHROPIC_API_KEY intentionally NOT set -- test_rag_query_pipeline.py
          # self-skips its real-LLM assertion when it's absent (see that
          # file's pytestmark), same pattern as ingestion above.
        run: pytest tests/integration/ -v -m integration --tb=short -q

  e2e:
    name: E2E (Playwright, role-diverse)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    needs: [test-unit, dashboard-test]
    # Phase 11 / ADR-018 Stage 11.3. Confirmed decision: manual trigger
    # only -- this needs the equivalent of the full docker-compose
    # stack running inside the runner (infra + api-gateway + a real
    # Keycloak + the built dashboard), real cost not worth paying on
    # every PR. Structurally different from test-integration: that job
    # stands up infra dependencies for in-process test code; this one
    # needs the actual running application, reachable by a real
    # browser.
    #
    # VERIFICATION STATUS: dashboard/e2e/auth.setup.ts,
    # playwright.config.ts, and rbac-navigation.spec.ts were all
    # verified this phase with real `tsc --noEmit` (against the config
    # that actually covers e2e/**, tsconfig.node.json -- the main
    # tsconfig.json doesn't) and real `npx playwright test --list`
    # (27 tests across 4 files, correctly scoped per project, zero
    # collection errors -- caught and fixed a real ESM __dirname bug
    # doing this). The full login flow against a live Keycloak was
    # NOT executed -- no Docker available in the sandbox this phase's
    # verification ran in. Run once for real before trusting this job.
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: pvh
          POSTGRES_PASSWORD: pvh_local
          POSTGRES_DB: pvh
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      weaviate:
        image: semitechnologies/weaviate:1.24.1
        ports:
          - 8080:8080
          - 50051:50051
        env:
          AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
          PERSISTENCE_DATA_PATH: /var/lib/weaviate
          DEFAULT_VECTORIZER_MODULE: none
          CLUSTER_HOSTNAME: weaviate-ci
        options: >-
          --health-cmd "wget -qO- http://localhost:8080/v1/.well-known/ready"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
      qdrant:
        image: qdrant/qdrant:v1.8.1
        ports:
          - 6333:6333
          - 6334:6334
        options: >-
          --health-cmd "wget -qO- http://localhost:6333/healthz"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
      vault:
        image: hashicorp/vault:1.15
        ports:
          - 8200:8200
        env:
          VAULT_DEV_ROOT_TOKEN_ID: dev-root-token
          VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
        options: >-
          --cap-add=IPC_LOCK
          --health-cmd "vault status -address=http://127.0.0.1:8200"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://pvh:pvh_local@localhost:5432/pvh
      REDIS_URL: redis://localhost:6379/0
      WEAVIATE_HOST: localhost
      WEAVIATE_PORT: "8080"
      QDRANT_HOST: localhost
      QDRANT_PORT: "6333"
      VAULT_ADDR: http://localhost:8200
      VAULT_TOKEN: dev-root-token
      AUTH_ENABLED: "true"
      LLM_DEFAULT_PROVIDER: mock
      KEYCLOAK_BASE_URL: http://localhost:8443

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install api-gateway + rag-engine + vector-store deps
        run: |
          pip install -r api-gateway/requirements.txt
          pip install -r rag-engine/requirements.txt
          pip install -r vector-store/requirements.txt
          pip install requests  # infra/keycloak/import_realm.py

      - name: Start Keycloak
        # docker run, not a `services:` block -- GitHub Actions service
        # containers don't support command overrides, and this image
        # needs `start-dev` as an explicit argument (confirmed from
        # docker-compose.yml's own `command: start-dev --import-realm`).
        run: |
          docker run -d --name keycloak --network host \
            -e KEYCLOAK_ADMIN=admin \
            -e KEYCLOAK_ADMIN_PASSWORD=admin_local \
            -e KC_HTTP_ENABLED=true \
            -e KC_HOSTNAME_STRICT=false \
            -e KC_HTTP_PORT=8443 \
            quay.io/keycloak/keycloak:24.0 start-dev
          for i in $(seq 1 30); do
            curl -sf http://localhost:8443/health/ready && break
            sleep 3
          done

      - name: Import realm
        run: python infra/keycloak/import_realm.py

      - name: Run Alembic migrations
        working-directory: api-gateway
        run: python -m alembic upgrade head

      - name: Seed tenants and users
        run: python infra/scripts/seed_data.py

      - name: Set up Weaviate and Qdrant collections
        run: |
          python vector-store/scripts/setup_weaviate_schema.py
          python vector-store/scripts/setup_qdrant_schema.py

      - name: Start api-gateway
        working-directory: api-gateway
        run: |
          nohup uvicorn src.main:app --host 0.0.0.0 --port 8000 > /tmp/api-gateway.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health && break
            sleep 1
          done
          curl -sf http://localhost:8000/health || (cat /tmp/api-gateway.log && exit 1)

      - name: Install dashboard deps
        working-directory: dashboard
        run: npm ci --legacy-peer-deps

      - name: Install Playwright browsers
        working-directory: dashboard
        run: npx playwright install --with-deps chromium

      - name: Build and preview dashboard
        working-directory: dashboard
        env:
          VITE_AUTH_ENABLED: "true"
          VITE_KEYCLOAK_URL: http://localhost:8443
          VITE_KEYCLOAK_REALM: patientvectorhub
          VITE_KEYCLOAK_CLIENT_ID: pvh-spa
        run: |
          npm run build
          nohup npm run preview -- --port 5173 > /tmp/dashboard.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:5173 && break
            sleep 1
          done

      - name: Run Playwright (role-diverse projects only)
        working-directory: dashboard
        env:
          PVH_E2E_BASE_URL: http://localhost:5173
        run: |
          npx playwright test \
            --project=setup --project=admin --project=engineer \
            --project=analyst --project=auditor --project=readonly

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: dashboard/playwright-report/

  load-test:
    name: Load Test (dispatch rate)
    runs-on: ubuntu-latest
    needs: [test-unit, test-unit-ingestion]
    # Phase 11 / ADR-018 Stage 11.2. Confirmed decision: measure
    # dispatch-to-Kafka throughput here, on a real cadence, rather than
    # only locally/nightly -- see docs/PHASE_11_IMPLEMENTATION_PLAN.md's
    # 5,000 docs/sec extrapolation methodology for how the full
    # end-to-end production number (celery-worker's docker-compose
    # concurrency of 4 makes that unreachable on this runner) relates
    # to what this job actually gates on.
    #
    # VERIFICATION STATUS: locustfile.py and check_dispatch_rate.py
    # were both run for real this phase, against a stub HTTP server
    # standing in for these two routes -- confirmed clean (0% failures,
    # correct req/s computation, confirmed the gate script's own
    # pass/fail paths). Booting the real api-gateway via uvicorn in
    # this exact GitHub Actions shape (below) was written and reviewed
    # against the real code (sitecustomize.py's cross-service import
    # mechanism, deps.py's AUTH_ENABLED requirement for the X-API-Key
    # path) but NOT executed -- no Docker/Postgres was available in the
    # sandbox this phase's other verification ran in. Run once for real
    # before trusting this job blindly.
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: pvh
          POSTGRES_PASSWORD: pvh_local
          POSTGRES_DB: pvh
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      kafka:
        image: apache/kafka:3.6.0
        ports:
          - 9092:9092
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_CONTROLLER_QUORUM_VOTERS: "1@localhost:9093"
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
          CLUSTER_ID: pvh-ci-cluster-id-002
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 12
      weaviate:
        image: semitechnologies/weaviate:1.24.1
        ports:
          - 8080:8080
          - 50051:50051
        env:
          AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
          PERSISTENCE_DATA_PATH: /var/lib/weaviate
          DEFAULT_VECTORIZER_MODULE: none
          CLUSTER_HOSTNAME: weaviate-ci
        options: >-
          --health-cmd "wget -qO- http://localhost:8080/v1/.well-known/ready"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
      qdrant:
        image: qdrant/qdrant:v1.8.1
        ports:
          - 6333:6333
          - 6334:6334
        options: >-
          --health-cmd "wget -qO- http://localhost:6333/healthz"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
      vault:
        image: hashicorp/vault:1.15
        ports:
          - 8200:8200
        env:
          VAULT_DEV_ROOT_TOKEN_ID: dev-root-token
          VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
        options: >-
          --cap-add=IPC_LOCK
          --health-cmd "vault status -address=http://127.0.0.1:8200"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ENVIRONMENT: test  # NOT production -- see llm_router.py's mock-provider gate
      DATABASE_URL: postgresql+asyncpg://pvh:pvh_local@localhost:5432/pvh
      REDIS_URL: redis://localhost:6379/0
      KAFKA_BROKERS: localhost:9092
      WEAVIATE_HOST: localhost
      WEAVIATE_PORT: "8080"
      QDRANT_HOST: localhost
      QDRANT_PORT: "6333"
      VAULT_ADDR: http://localhost:8200
      VAULT_TOKEN: dev-root-token
      AUTH_ENABLED: "true"  # required for the X-API-Key path -- see deps.py
      LLM_DEFAULT_PROVIDER: mock  # rag-engine/src/config.py -- refused outright if ENVIRONMENT=production
      KEYCLOAK_BASE_URL: http://keycloak.invalid  # never actually contacted -- API-key requests short-circuit before touching JWKS (see auth.py's dispatch())

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install api-gateway deps
        working-directory: api-gateway
        run: pip install -r requirements.txt

      - name: Install rag-engine + vector-store deps
        # api-gateway's own sitecustomize.py adds these sibling src/
        # dirs to sys.path at interpreter startup -- their own
        # dependencies still need installing into the same environment.
        run: |
          pip install -r rag-engine/requirements.txt
          pip install -r vector-store/requirements.txt

      - name: Install Locust
        run: pip install locust==2.46.4

      - name: Run Alembic migrations
        working-directory: api-gateway
        run: python -m alembic upgrade head

      - name: Seed one tenant and capture the API key
        id: seed
        run: |
          python infra/scripts/seed_data.py | tee /tmp/seed_output.log
          key=$(grep "Acme Health" /tmp/seed_output.log | awk '{print $NF}')
          if [ -z "$key" ]; then
            echo "::error::Could not parse seeded API key from seed_data.py output"
            exit 1
          fi
          echo "api_key=$key" >> "$GITHUB_OUTPUT"

      - name: Set up Weaviate and Qdrant collections
        run: |
          python vector-store/scripts/setup_weaviate_schema.py
          python vector-store/scripts/setup_qdrant_schema.py

      - name: Start api-gateway
        working-directory: api-gateway
        run: |
          nohup uvicorn src.main:app --host 0.0.0.0 --port 8000 > /tmp/api-gateway.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health && break
            sleep 1
          done
          curl -sf http://localhost:8000/health || (cat /tmp/api-gateway.log && exit 1)

      - name: Run Locust (dispatch-rate check)
        env:
          PVH_LOAD_TEST_API_KEY: ${{ steps.seed.outputs.api_key }}
        run: |
          mkdir -p tests/load/results
          locust -f tests/load/locustfile.py --headless \
            --host http://localhost:8000 \
            --users 50 --spawn-rate 10 --run-time 60s \
            --csv tests/load/results/dispatch_rate

      - name: Enforce dispatch-rate gate
        run: |
          python tests/load/check_dispatch_rate.py \
            tests/load/results/dispatch_rate_stats.csv \
            --run-time-seconds 60 \
            --min-dispatch-rate 20 \
            --max-failure-pct 5.0

      - name: Upload Locust results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: locust-dispatch-rate-results
          path: tests/load/results/

  security-scan:
    name: Security Scan (Trivy)
    runs-on: ubuntu-latest
    needs:
      [
        lint,
        test-unit,
        test-unit-ingestion,
        test-unit-vector-store,
        test-unit-rag-engine,
        test-unit-embedding-server,
      ]
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        # Phase 7 fix: context changed from api-gateway/ to repo root (.),
        # matching ingestion's build below -- api-gateway/Dockerfile now
        # COPYs rag-engine/src/ and vector-store/src/ in alongside its own
        # source (see that Dockerfile's header comment), which isn't
        # reachable from a context scoped to api-gateway/ alone.
        run: docker build -f api-gateway/Dockerfile -t pvh-api:${{ github.sha }} .

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: pvh-api:${{ github.sha }}
          severity: CRITICAL
          exit-code: "1"
          format: table

      - name: Build ingestion image
        run: docker build -f ingestion/Dockerfile -t pvh-ingestion:${{ github.sha }} .

      - name: Trivy scan ingestion
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: pvh-ingestion:${{ github.sha }}
          severity: CRITICAL
          exit-code: "1"
          format: table
