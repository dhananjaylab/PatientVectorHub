name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: dev
        type: choice
        options: [dev, staging, production]

jobs:
  deploy:
    name: Deploy to ${{ github.event.inputs.environment || 'dev' }}
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'dev' }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push images
        env:
          ECR: ${{ steps.ecr-login.outputs.registry }}
          SHA: ${{ github.sha }}
        run: |
          # Phase 7 fix: both builds were still using their own service
          # directory as context (api-gateway/, ingestion/) instead of the
          # repo root — caught the same way the original deploy.yml
          # build-context bug was caught in Phase 4 ("Validate against
          # actual repo dumps"), by reading this file's actual current
          # content rather than assuming an earlier fix had landed here.
          # ingestion/Dockerfile has needed repo-root context since Phase 4
          # (COPY vector-store/src/ ./vector_store/) and api-gateway/
          # Dockerfile needs it as of Phase 7 (COPY rag-engine/src/ +
          # vector-store/src/) — neither COPY source is reachable from a
          # context scoped to the service's own subdirectory. CI's
          # security-scan job (.github/workflows/ci.yml) already builds
          # ingestion correctly this way; it just hadn't been carried over
          # to this file.
          docker build -f api-gateway/Dockerfile -t $ECR/pvh-api:$SHA .
          docker build -f ingestion/Dockerfile -t $ECR/pvh-workers:$SHA .
          # pvh-embedding build/push removed (ADR-012) — the clinical
          # embedding path now runs on a Hugging Face Inference Endpoint,
          # provisioned separately via scripts/deploy_hf_embedding_endpoint.py.
          # There is no image of ours to build for it anymore.
          docker push $ECR/pvh-api:$SHA
          docker push $ECR/pvh-workers:$SHA

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name pvh-${{ github.event.inputs.environment || 'dev' }} \
            --region us-east-1

      - name: Helm deploy (atomic — auto-rollback on failure)
        env:
          ENV: ${{ github.event.inputs.environment || 'dev' }}
          SHA: ${{ github.sha }}
          ECR: ${{ steps.ecr-login.outputs.registry }}
        run: |
          helm upgrade --install pvh-app ./infra/helm/pvh-app \
            -f ./infra/helm/values/${ENV}.yaml \
            --set image.tag=${SHA} \
            --set image.registry=${ECR} \
            --namespace pvh-app \
            --create-namespace \
            --atomic \
            --timeout 10m \
            --wait
