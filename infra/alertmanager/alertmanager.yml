# PatientVectorHub — Alertmanager config (Phase 10 / ADR-017).
#
# The "starter set" decision was 4-6 critical alerts, not a full
# on-call paging setup — no Slack webhook URL, PagerDuty key, or email
# SMTP config exists anywhere in this codebase's .env.example files, so
# this deliberately does NOT invent one. The webhook receiver below
# points at a local, no-op HTTP endpoint (httpbin-style echo) purely so
# `docker-compose up alertmanager` boots into something visibly
# functional rather than erroring on an empty receivers list. Wiring a
# REAL notification channel is a one-line change once Dhananjay has an
# actual Slack/PagerDuty target to point at — flagged in
# PHASE_10_IMPLEMENTATION_PLAN.md rather than guessed at here.

global:
  resolve_timeout: 5m

route:
  receiver: default
  group_by: ["alertname", "service"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    # Vault errors get a shorter repeat interval than everything else —
    # a PHI-encryption failure is the one alert class in this set where
    # "we already know, stop paging us" for 4 hours is the wrong default.
    - matchers:
        - alertname="PVHVaultOperationErrors"
      repeat_interval: 30m

receivers:
  - name: default
    webhook_configs:
      - url: "http://localhost:9095/alerts"
        send_resolved: true
