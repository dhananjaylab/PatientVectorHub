[pytest]
# Embedding Server tests configuration
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
pythonpath = .

# Markers
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow tests
    clinical_bert: Clinical BERT embedding tests
    deployment: Deployment script tests

# Logging
log_cli = false
log_cli_level = INFO
log_file = tests/pytest.log
log_file_level = DEBUG

# Addopts
addopts = 
    -v
    --tb=short
    --strict-markers
