[pytest]
# Vector Store service tests configuration
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
pythonpath = .

# Markers
markers =
    unit: Unit tests (no external dependencies)
    integration: Integration tests (requires live Weaviate or Qdrant)
    slow: Slow tests
    weaviate: Weaviate-specific tests
    qdrant: Qdrant-specific tests
    dual_write: Dual-write wrapper tests

# Asyncio configuration
asyncio_mode = auto

# Logging
log_cli = false
log_cli_level = INFO
log_file = tests/pytest.log
log_file_level = DEBUG

# Addopts
addopts = 
    -v
    --tb=short
    --strict-markers
