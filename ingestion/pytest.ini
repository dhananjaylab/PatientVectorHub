[pytest]
# Ingestion service tests configuration
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
pythonpath = .

# Markers
markers =
    unit: Unit tests (no external dependencies)
    integration: Integration tests (requires docker-compose or live services)
    slow: Slow tests
    parser: Document parsing tests
    embeddings: Embedding generation tests
    chunker: Text chunking tests
    dlq: Dead Letter Queue tests

# Asyncio configuration
asyncio_mode = auto

# Logging
log_cli = false
log_cli_level = INFO
log_file = tests/pytest.log
log_file_level = DEBUG

# Addopts
addopts = 
    -v
    --tb=short
    --strict-markers
